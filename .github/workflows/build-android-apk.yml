name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        env:
          VITE_SUPABASE_URL: https://ksgapugqzqxuogltsudr.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzZ2FwdWdxenF4dW9nbHRzdWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0ODY4NzMsImV4cCI6MjEwNTA2Mjg3M30.wV8TASaAhq5csr9SQrKwhNTmEe0G-RVOs7m9kZAMmmw
          GEMINI_API_KEY: AIzaSyBQ3PG_xUHTUtLz41AieVY_eTVOaI_-Tk8
          VITE_VAPID_PUBLIC_KEY: sb_publishable_qlcT5-eeGpdmJUTjU70X8Q_DaJsNz91
          VITE_SUPABASE_FUNCTIONS_URL: https://ksgapugqzqxuogltsudr.supabase.co/functions/v1
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APKs
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: velour-app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: velour-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
